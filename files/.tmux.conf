# tmux is the load-bearing session primitive. Persistent layouts across
# reboots come from tmux-resurrect + tmux-continuum below.

# Prefix: C-a is more ergonomic than default C-b
unbind C-b
set -g prefix C-a
bind C-a send-prefix

# General
set -g mouse on
set -g history-limit 50000
set -g default-terminal "tmux-256color"
set -ga terminal-overrides ",xterm-256color:Tc,alacritty:Tc"
set -g escape-time 10
set -g focus-events on
setw -g mode-keys vi
set -g renumber-windows on
set -g base-index 1
setw -g pane-base-index 1

# Mouse behavior: keep click-to-focus and wheel-scroll, but stop tmux from
# stranding you in copy-mode after a drag. Default tmux 3.x behavior:
# MouseDrag → enter copy-mode → yank selection → REMAIN in copy-mode.
# The rebinds below yank to clipboard and exit copy-mode on release.
# Also make wheel-scroll exit cleanly when scrolled back to the bottom.
bind-key -T copy-mode-vi MouseDragEnd1Pane send-keys -X copy-pipe-and-cancel 'pbcopy'
bind-key -T copy-mode-vi Enter              send-keys -X copy-pipe-and-cancel 'pbcopy'
# Click into a pane just focuses; it doesn't select.
bind-key -T root MouseDown1Pane select-pane -t = \; send-keys -M

# Splits: | and - preserve cwd
bind | split-window -h -c "#{pane_current_path}"
bind - split-window -v -c "#{pane_current_path}"
bind c new-window -c "#{pane_current_path}"
unbind '"'
unbind %

# Vim-style pane navigation
bind h select-pane -L
bind j select-pane -D
bind k select-pane -U
bind l select-pane -R

# Fast reload
bind r source-file ~/.tmux.conf \; display-message "reloaded ~/.tmux.conf"

# Status line — minimal, dark, right-aligned session name.
# colour234 is a dark-but-not-black gray; keeps whites/cyans readable
# without blending into the terminal background.
set -g status-position bottom
set -g status-style "bg=colour234,fg=white"
set -g status-left ""
# Left side of status-right: fleet indicator aggregating Claude Code state
# across every pane in the current session, grouped by window. The script
# is pure tmux display glue — it reads state files under ~/.claude/state/
# populated by the sibling Claude-hook scripts in files/claude-hooks/. See
# README section "Why the Claude→state-file→tmux bridge exists".
set -g status-right "#(~/.tmux-scripts/fleet-status.sh)  #[fg=cyan]#S #[fg=white]| #[fg=yellow]%H:%M "
set -g status-right-length 120

# Per-pane status border. Each pane's top border shows:
#   left  : pane title (working dir shortname, or "zsh" / "nvim" etc.)
#   right : agent state glyph read from ~/.claude/state/pane-<id>.state
#           (● running / ✓ done / ⚠ input needed) via a helper script.
# This is what lets you glance at any pane from any pane and see the
# state of the Claude Code process inside it — no window switching.
set -g pane-border-status top
set -g pane-border-format ' #{pane_current_command} · #{b:pane_current_path}  #(~/.tmux-scripts/pane-status.sh #{pane_id}) '
set -g pane-border-style "fg=colour244,bg=colour234"
set -g pane-active-border-style "fg=cyan,bg=colour234"

# Redraw the status bar and pane borders every 5 seconds so hook-written
# state files are picked up promptly. Default is 15s. Kept above 2s because
# tmux invokes the fleet-status + pane-status hooks every interval, and
# tighter values create fork-storm latency that starves pane I/O.
set -g status-interval 5

# Highlight background panes that produced output (secondary "something
# happened here" signal, distinct from the primary hook-driven state).
setw -g monitor-activity on
set -g visual-activity off  # don't beep or print an intrusive message

# Window-status coloring by name prefix.
# The Claude Code hooks in ~/.claude/hooks/tmux-mark.sh rename the window
# with a leading glyph reflecting agent state:
#   ● prefix → agent is running (green)
#   ✓ prefix → last turn done (dim gray, still glanceable)
#   ⚠ prefix → agent wants input (yellow, more urgent)
# Windows without those glyphs render with the default style.
setw -g window-status-format         '#[fg=#{?#{m/r:^●,#W},green,#{?#{m/r:^✓,#W},colour244,#{?#{m/r:^⚠,#W},yellow,white}}}] #I:#W '
setw -g window-status-current-format '#[fg=#{?#{m/r:^●,#W},green,#{?#{m/r:^✓,#W},colour250,#{?#{m/r:^⚠,#W},yellow,cyan}}},bold] #I:#W '
setw -g window-status-current-style "bold"

# tpm + persistence plugins
set -g @plugin 'tmux-plugins/tpm'
set -g @plugin 'tmux-plugins/tmux-sensible'
set -g @plugin 'tmux-plugins/tmux-resurrect'
set -g @plugin 'tmux-plugins/tmux-continuum'

# tmux-continuum: auto-save every 15 min, auto-restore on server start
set -g @continuum-restore 'on'
set -g @continuum-save-interval '15'
set -g @resurrect-capture-pane-contents 'on'
set -g @resurrect-strategy-nvim 'session'

# Bootstrap tpm if missing, then load plugins.
if "test ! -d ~/.tmux/plugins/tpm" \
   "run 'git clone https://github.com/tmux-plugins/tpm ~/.tmux/plugins/tpm && ~/.tmux/plugins/tpm/bin/install_plugins'"

run '~/.tmux/plugins/tpm/tpm'
