# tmux is the load-bearing session primitive. Persistent layouts across
# reboots come from tmux-resurrect + tmux-continuum below.

# Prefix: C-a is more ergonomic than default C-b
unbind C-b
set -g prefix C-a
bind C-a send-prefix

# General
set -g mouse on
set -g history-limit 50000
set -g default-terminal "tmux-256color"
set -ga terminal-overrides ",xterm-256color:Tc,alacritty:Tc"
set -g escape-time 10
set -g focus-events on
setw -g mode-keys vi
setw -g monitor-activity on
set -g renumber-windows on
set -g base-index 1
setw -g pane-base-index 1

# Splits: | and - preserve cwd
bind | split-window -h -c "#{pane_current_path}"
bind - split-window -v -c "#{pane_current_path}"
bind c new-window -c "#{pane_current_path}"
unbind '"'
unbind %

# Vim-style pane navigation
bind h select-pane -L
bind j select-pane -D
bind k select-pane -U
bind l select-pane -R

# Fast reload
bind r source-file ~/.tmux.conf \; display-message "reloaded ~/.tmux.conf"

# Status line — minimal, dark, right-aligned session name
set -g status-position bottom
set -g status-style "bg=default,fg=white"
set -g status-left ""
set -g status-right "#[fg=cyan]#S #[fg=white]| #[fg=yellow]%H:%M "
set -g status-right-length 60

# Window-status coloring by name prefix.
# The Claude Code hooks in ~/.claude/hooks/tmux-mark.sh rename the window
# with a leading glyph reflecting agent state:
#   ● prefix → agent is running (green)
#   ✓ prefix → last turn done (dim gray, still glanceable)
#   ⚠ prefix → agent wants input (yellow, more urgent)
# Windows without those glyphs render with the default style.
setw -g window-status-format         '#[fg=#{?#{m/r:^●,#W},green,#{?#{m/r:^✓,#W},colour244,#{?#{m/r:^⚠,#W},yellow,white}}}] #I:#W '
setw -g window-status-current-format '#[fg=#{?#{m/r:^●,#W},green,#{?#{m/r:^✓,#W},colour250,#{?#{m/r:^⚠,#W},yellow,cyan}}},bold] #I:#W '
setw -g window-status-current-style "bold"

# tpm + persistence plugins
set -g @plugin 'tmux-plugins/tpm'
set -g @plugin 'tmux-plugins/tmux-sensible'
set -g @plugin 'tmux-plugins/tmux-resurrect'
set -g @plugin 'tmux-plugins/tmux-continuum'

# tmux-continuum: auto-save every 15 min, auto-restore on server start
set -g @continuum-restore 'on'
set -g @continuum-save-interval '15'
set -g @resurrect-capture-pane-contents 'on'
set -g @resurrect-strategy-nvim 'session'

# Bootstrap tpm if missing, then load plugins.
if "test ! -d ~/.tmux/plugins/tpm" \
   "run 'git clone https://github.com/tmux-plugins/tpm ~/.tmux/plugins/tpm && ~/.tmux/plugins/tpm/bin/install_plugins'"

run '~/.tmux/plugins/tpm/tpm'
