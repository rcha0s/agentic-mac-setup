# Herdr multiplexer config. Adapted from Kun Chen's kunchenguid/dotfiles.
#
# Herdr coexists with tmux in this setup: tmux is now opt-in (interactive
# shells stay in plain zsh by default; set AUTO_ATTACH_TMUX=1 to restore
# the always-attach behavior). Herdr is launched directly via WezTerm's
# CMD+Shift+H keybind (see files/.config/wezterm/wezterm.lua).
#
# Key layout mimics our tmux config (ctrl+a prefix, hjkl nav) so
# muscle memory transfers between them. Herdr's copy-mode internal
# keys (v/space to select, y/Enter to copy, q/Esc to cancel) aren't
# user-configurable.

[keys]
prefix = "ctrl+a"

focus_pane_left  = "prefix+h"
focus_pane_down  = "prefix+j"
focus_pane_up    = "prefix+k"
focus_pane_right = "prefix+l"

split_horizontal = "prefix+_"
split_vertical   = "prefix+|"

new_tab   = "prefix+n"
close_tab = "prefix+/"

workspace_picker = "prefix+w"
goto             = "prefix+g"

copy_mode = "prefix+c"

[ui]
# "spaces" groups agents by workspace (the default); "priority" is an
# alternative Herdr offers. Keep "spaces" explicit so a future default
# flip doesn't silently reorder our panel.
agent_panel_sort = "spaces"
